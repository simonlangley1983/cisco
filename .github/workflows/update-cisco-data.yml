name: Update Cisco share price data

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes across US market hours, allowing for DST shifts.
    # Covers 09:30-16:00 New York time in both summer and winter.
    - cron: "*/15 13-21 * * 1-5"

    # Daily late refresh for news/rankings
    - cron: "15 23 * * *"

concurrency:
  group: update-cisco-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-cisco-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Cisco JSON
        run: |
          python scripts/build_cisco_json.py

      - name: Generate Cisco news
        if: github.event.schedule == '15 23 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/generate_news.py

      - name: Update Cisco market cap rank
        if: github.event.schedule == '15 23 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/generate_market_cap_rank.py

      - name: Show key outputs
        run: |
          echo "---- cisco_daily.json ----"
          cat data/cisco_daily.json || true
          echo "---- cisco_news.json ----"
          cat data/cisco_news.json || true
          echo "---- git status ----"
          git status --porcelain

      - name: Commit and push changes
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/cisco_daily.json data/cisco_news.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Cisco share price and news data"
          git push
